; Runtime limits for the application image.
;
; These used to live in public/.user.ini. That file is only read by the
; CGI/FPM SAPIs — production runs FrankenPHP, which never applied it, so the
; limits silently stayed at PHP's defaults. A technician attaching photos to
; a progress report over mobile data hit "Maximum execution time of 30
; seconds exceeded" — 30s being the stock default, not the 240 that
; .user.ini claimed to set.
;
; Loaded from /usr/local/etc/php/conf.d, which FrankenPHP does read.

; A phone on 4G uploading several site photos is a slow request by nature.
max_execution_time = 240

; Time allowed to receive the request body. Uploads are counted here, so it
; has to match the execution budget or a slow uplink dies mid-transfer.
max_input_time = 240

; Six photos at 10MB each, plus form fields and multipart overhead. Per-file
; and total limits are separate: the total has to clear the sum.
upload_max_filesize = 20M
post_max_size = 128M
max_file_uploads = 25

; Image handling holds a decoded bitmap in memory; the default 128M is tight
; for a large photo.
memory_limit = 512M
