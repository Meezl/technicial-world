; NOT the authoritative limits for production.
;
; .user.ini is read only by the CGI and FPM SAPIs. Production runs
; FrankenPHP, which ignores this file entirely — so for two releases these
; values looked set while PHP actually ran on its defaults, and photo
; uploads died at the stock 30-second execution limit.
;
; The real limits live in docker/php.ini, copied into
; /usr/local/etc/php/conf.d/zz-app.ini by the Dockerfile. Change them there.
; This file is kept only for local setups served through PHP-FPM, and is
; deliberately identical to docker/php.ini so the two cannot drift.

upload_max_filesize = 20M
post_max_size = 128M
max_file_uploads = 25
max_execution_time = 240
max_input_time = 240
memory_limit = 512M
