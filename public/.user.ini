; PHP runtime overrides for this application.
; .user.ini is honoured by PHP-FPM (Railway / nginx) and lets us bump
; defaults without touching the system php.ini.

; Allow up to 20 MB per file and 60 MB per request (5 photos at 12 MB each).
upload_max_filesize = 20M
post_max_size = 60M

; More memory for image manipulation (PDF rendering, etc.)
memory_limit = 256M

; Give slow mobile uploads time to finish before the script is killed.
max_execution_time = 120
max_input_time = 120
